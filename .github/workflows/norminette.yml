name: 42 Norminette CI

on:
  push:
    branches: [main]
    paths:
      - "**.c"
      - "**.h"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/libraries/**"
      - "!**/lib/mlx42/**"
      - "!**/lib/MLX42/**"
  pull_request:
    branches: [main]
    paths:
      - "**.c"
      - "**.h"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/libraries/**"
      - "!**/lib/mlx42/**"
      - "!**/lib/MLX42/**"
  workflow_dispatch:
    inputs:
      target_dir:
        description: "Specific directory to check (leave empty for changed files)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  norminette:
    name: Check Norm Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Norminette
        run: |
          python -m pip install --upgrade pip
          pip install norminette

      - name: Verify Norminette Version
        run: norminette -v

      - name: Run Norminette on Changed Files
        if: "${{ github.event.inputs.target_dir == '' }}"
        run: |
          echo "Detecting modified C and header files (excluding test suites)..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="HEAD^1 HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF_TARGET="${{ github.event.before }} HEAD"
          else
            DIFF_TARGET="HEAD~1 HEAD"
          fi

          echo "Using diff target: $DIFF_TARGET"
          FILES=$(git diff --diff-filter=d --name-only $DIFF_TARGET | grep -E '\.(c|h)$' | grep -v -E '(^|/)(tests?|libraries|lib/mlx42|lib/MLX42)/' || true)

          EXISTING_FILES=""
          for f in $FILES; do
            if [ -f "$f" ]; then
              EXISTING_FILES="$EXISTING_FILES $f"
            fi
          done

          if [ -z "$EXISTING_FILES" ]; then
            echo "No project C/header files modified (or only test/vendor files changed). Skipping."
            exit 0
          fi

          echo "Checking source files:"
          echo "$EXISTING_FILES"
          norminette $EXISTING_FILES

      - name: Run Norminette on Specific Directory
        if: "${{ github.event.inputs.target_dir != '' }}"
        run: |
          echo "Running norminette on: ${{ github.event.inputs.target_dir }} (excluding tests/ and vendor libraries)"
          FILES=$(find "${{ github.event.inputs.target_dir }}" -type f \( -name "*.c" -o -name "*.h" \) | grep -v -E '(^|/)(tests?|libraries|lib/mlx42|lib/MLX42)/' || true)
          if [ -z "$FILES" ]; then
            echo "No source files found in directory."
            exit 0
          fi
          norminette $FILES
